<script>
  // the theme before the first paint: the person's last choice, else the system's
  try {
    const t = localStorage.getItem('ccf-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  } catch { /* private mode */ }
</script>
</head>

<div id="app"></div>
<div id="layer"></div>
<script type="module" src="/web/app.js"></script>
